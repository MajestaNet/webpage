[build]
  command = "npm test && npm run check && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[redirects]]
  from = "/notes/a-public-notebook"
  to = "/notes/conscious-cognitive-learning"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/notes"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/notes/:splat"
  status = 301

[[redirects]]
  from = "/notes/"
  to = "/notes"
  status = 301

[[redirects]]
  from = "/notes/:slug/"
  to = "/notes/:slug"
  status = 301

[[redirects]]
  from = "/terms/"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/terms#privacy-policy"
  status = 301

[[redirects]]
  from = "/privacy/"
  to = "/terms#privacy-policy"
  status = 301

# Unknown routes stay as a real 404 so article URLs are not silently rewritten.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
